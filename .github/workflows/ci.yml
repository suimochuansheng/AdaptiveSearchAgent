name: CI

on:
  push:
    branches: [main, develop, dev_setup]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # T63-012 / T63-015 要用 `git show 423c1ea`，默认 depth=1 的浅克隆取不到该提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry (2.x)
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 2.4.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run tests with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          REDIS_URL: redis://localhost:6379/0
        run: |
          poetry run pytest tests/ \
            -m "not e2e" \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=60
      - name: Architecture contracts (import-linter)
        run: poetry run lint-imports
      - name: T11 three-layer skeleton / dependency rules
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          REDIS_URL: redis://localhost:6379/0
        run: poetry run python "tests/test_agent_cases/T11-三层骨架+依赖规则/t11_checks.py"
      - name: T12 frozen contracts
        run: poetry run python "tests/test_agent_cases/T12-契约冻结/t12_checks.py"
      - name: T63 permissions and budget
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          REDIS_URL: redis://localhost:6379/0
        run: poetry run python "tests/test_agent_cases/T63-权限与预算/t63_checks.py"
      - name: Ledger health check
        run: poetry run python scripts/ci_check_ledger.py