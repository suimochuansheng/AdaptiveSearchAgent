repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        # mypy 的类型检查依赖于类型提示包（如 types-requests、types-redis 等），需要在 pre-commit 配置中添加这些依赖，以确保 mypy 能正确识别第三方库的类型信息。
        additional_dependencies: [
          'types-requests',
          'types-redis',         # 👈 添加这一行，这是解决方案的核心
          'types-python-dateutil',
        ]