[tool.poetry]
name = "adsearchagent"
version = "0.1.0"
description = "Adaptive Search Agent"
authors = ["Your Name"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.1.10"
langchain = "^1.2.17"
tavily-python = "^0.7.24"
ollama = "^0.6.2"
python-json-logger = "^4.1.0"
pydantic-settings = "^2.14.0"
tenacity = "^9.1.4"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
langchain-community = "^0.4.1"
langchain-ollama = "^1.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "bandit (>=1.9.4,<2.0.0)"
]
