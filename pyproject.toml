[tool.poetry]
name = "adsearchagent"
version = "0.1.0"
description = "Adaptive Search Agent"
authors = ["Your Name"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.1.10"
langchain = "^1.2.17"
tavily-python = "^0.7.24"
ollama = "^0.6.2"
python-json-logger = "^4.1.0"
pydantic-settings = "^2.14.0"
tenacity = "^9.1.4"
fastapi = "^0.136.1"
uvicorn = {extras = ["standard"], version = "^0.47.0"}
langchain-community = "^0.4.1"
langchain-ollama = "^1.1.0"
httpx = "^0.28.1"
langchain-deepseek = "^1.0.1"
rich = "^13.0.0"
langgraph-cli = {extras = ["inmem"], version = "^0.4.26"}
langgraph-checkpoint-postgres = "^3.1.0"
psycopg = {extras = ["binary"], version = "^3.3"}
psycopg-pool = "^3.3"
python-dotenv = "^1.2.2"
redis = "^7.4.0"
pydantic = "^2.13.4"
pgvector = "^0.4.2"

[tool.poetry.group.frontend]
optional = true  # 可选组，默认不安装

[tool.poetry.group.frontend.dependencies]
chainlit = ">=1.1.0"
httpx = ">=0.27.0"
python-dotenv = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "SIM", "TCH"]
ignore = ["E501"]  # 行长度交给格式化器

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "frontend/",
    "scripts/",
]

[tool.poetry.scripts] # 定义命令行脚本
# 只需要运行 poetry run api 就能启动服务器
api = "uvicorn api_main:app --reload --port 8000"