# RAG 质量评估测试集 v2 — YAML 格式（含元数据）
# 优先于 qa_dataset.json 加载；若此文件被删除，自动回退到 JSON。

- id: q001
  question: "RAG 解析流水线中，双栏布局测试的目的是什么？"
  ground_truth: "验证 PDF 解析器能否正确还原双栏页面的物理阅读顺序。"
  source_file: "test_rag_spec.pdf"
  category: "factual"
  difficulty: "medium"
  tags: ["解析", "双栏布局"]

- id: q002
  question: "PostgreSQL + pgvector 的写入吞吐量是多少？"
  ground_truth: "1,200 QPS"
  source_file: "test_rag_spec.pdf"
  category: "factual"
  difficulty: "easy"
  tags: ["PostgreSQL", "pgvector", "性能"]

- id: q003
  question: "子块（Child Chunk）的 Token 大小通常限制在多少？"
  ground_truth: "150 到 200"
  source_file: "test_rag_spec.pdf"
  category: "factual"
  difficulty: "easy"
  tags: ["分块策略", "Token"]

- id: q004
  question: "为什么解析模块的健壮性直接影响下游检索精准度？"
  ground_truth: "如果解析出的文本格式混乱、顺序颠倒，即使使用最先进的向量模型，也无法召回正确的上下文。"
  source_file: "test_rag_spec.pdf"
  category: "factual"
  difficulty: "medium"
  tags: ["解析", "检索精准度"]

- id: q005
  question: "父子块双路索引的目的是什么？"
  ground_truth: "当检索命中精细的子块时，自动关联并加载其背后的父块（约800 Tokens）送入模型，平衡检索精度与生成上下文的完整度。"
  source_file: "test_rag_spec.pdf"
  category: "factual"
  difficulty: "medium"
  tags: ["分块策略", "索引"]

- id: q006
  question: "什么是大模型的'迷失在中间'（Lost in the Middle）现象？"
  ground_truth: "过长的无用信息会导致大模型在生成时无法有效利用位于上下文中间部分的信息。"
  source_file: "test_rag_spec.pdf"
  category: "factual"
  difficulty: "medium"
  tags: ["大模型", "上下文"]

- id: q007
  question: "Milvus 的平均检索时延是多少？"
  ground_truth: "4.2 ms"
  source_file: "test_rag_spec.pdf"
  category: "factual"
  difficulty: "easy"
  tags: ["Milvus", "性能"]

