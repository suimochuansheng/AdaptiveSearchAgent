- id: q001
  question: "《RAG 解析流水线核心功能测试文档》开头说明它专门用于验证 PDFLoader 的哪些能力？"
  ground_truth: "验证 PDFLoader 的双栏布局提取、表格物理顺序混排以及低文本扫描件判定等核心工业级功能。"
  source_files: ["test_rag_spec.pdf"]
  category: "factual"
  difficulty: "medium"
  tags: ["解析", "双栏布局"]

