# v3 保持冻结，用于复现 2026-11-07 的第一轮基线；v4 用于下一轮对比。
#
# v4 相对 v3 的改动：
#   1. source_file（单值）→ source_files（列表），支持“同一答案多篇文档都算命中”，
#      配合评测脚本的 hit@k / 精排后 hit@k。
#   2. 锚定模糊题干：
