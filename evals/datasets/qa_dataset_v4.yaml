- id: q021
  question: "PostgreSQL + pgvector 与 Milvus (Standalone) 的写入吞吐量和平均检索时延分别是多少？按这两项指标，哪个更适合高写入、低时延场景？"
  ground_truth: "PostgreSQL + pgvector 是 1,200 QPS、8.5 ms；Milvus (Standalone) 是 3,500 QPS、4.2 ms。Milvus 的写入吞吐更高、时延更低，更适合高写入、低时延场景。"
  source_files: ["test_rag_spec.pdf"]
  category: "multi_hop"
  difficulty: "hard"
  tags: ["性能对比", "Milvus", "PostgreSQL"]

- id: q022
  question: "tech_blog 建议小规模数据集用 HNSW、大规模用 IVF-PQ；这两种索引分别优先解决什么问题？"
  ground_truth: "HNSW 构建速度快、检索精度高，适合小规模数据集；IVF-PQ 主要用于减少大规模数据集的内存占用。"
  source_files: ["tech_blog.md"]
  category: "summary"
  difficulty: "hard"
  tags: ["索引", "HNSW", "IVF-PQ"]

- id: q023
  question: "interrupt 暂停图执行后，为什么同一 thread_id 的锁不会被释放？恢复时又通过什么机制继续执行？"
  ground_truth: "interrupt 暂停图执行时不释放分布式锁，以保证同一 thread_id 同时只有一个图在执行；恢复时通过 Command(resume=...) 从 interrupt 处继续执行。"
  source_files: ["依据项目准备的面试题集.md", "请求追踪执行完整文档.md"]
  category: "multi_hop"
  difficulty: "hard"
  tags: ["LangGraph", "interrupt", "Redis"]

- id: q024
  question: "test_rag_spec 的表格顺序测试为什么要求输出保持“正文 1 → 表格 → 正文 2”，而不是把表格统一放到页面底部？"
  ground_truth: "为了验证解析器能否保持表格在原始页面中的物理阅读顺序，而不是把表格无脑堆砌到页面最下方。"
  source_files: ["test_rag_spec.pdf"]
  category: "multi_hop"
  difficulty: "hard"
  tags: ["解析", "表格顺序"]
