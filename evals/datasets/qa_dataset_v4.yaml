- id: q004
  question: "父子块双路索引的目的是什么？"
  ground_truth: "当检索命中精细的子块时，自动关联并加载其背后的父块（约 800 Tokens）送入模型，平衡检索精度与生成上下文的完整度。"
  source_files: ["test_rag_spec.pdf"]
  category: "factual"
  difficulty: "medium"
  tags: ["分块策略", "索引"]

