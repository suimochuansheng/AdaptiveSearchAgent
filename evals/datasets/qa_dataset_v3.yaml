- id: q011
  question: "LangGraph 的 interrupt 会执行哪些动作？"
  ground_truth: "保存当前 checkpoint 到持久化存储，抛出 GraphInterrupt 异常，暂停图执行，等待外部通过 Command(resume=...) 传入恢复指令。"
  source_file: "依据项目准备的面试题集.md"
  category: "factual"
  difficulty: "medium"
  tags: ["LangGraph", "HITL"]

- id: q012
  question: "LangGraph 的 Checkpoint 包含哪些内容？"
  ground_truth: "当前 AgentState 全量数据、图的执行位置、待处理的 pending 任务。"
  source_file: "依据项目准备的面试题集.md"
  category: "factual"
  difficulty: "medium"
  tags: ["LangGraph", "Checkpoint"]

- id: q013
  question: "LangGraph 的 Send API 如何实现并行搜索？"
  ground_truth: "Send API 是 LangGraph 内置的并行执行机制，在条件边的路由函数中返回 list[Send]，框架自动并发执行这些任务，结果通过 operator.add 合并到共享状态。"
  source_file: "依据项目准备的面试题集.md"
  category: "summary"
  difficulty: "medium"
  tags: ["LangGraph", "Send", "并行"]

- id: q014
  question: "为什么 Agent 执行需要 Redis 分布式锁？"
  ground_truth: "LangGraph 的 checkpoint 机制要求同一 thread_id 同时只有一个图在执行，否则会导致状态冲突，Redis 分布式锁保障了这一约束。"
  source_file: "依据项目准备的面试题集.md"
  category: "factual"
  difficulty: "medium"
  tags: ["Redis", "并发安全"]

- id: q015
  question: "应用启动阶段 lifespan 主要做哪些事？"
  ground_truth: "初始化 checkpointer、确保任务状态表存在、启动后台清理任务。"
  source_file: "请求追踪执行完整文档.md"
  category: "factual"
  difficulty: "medium"
  tags: ["FastAPI", "lifespan"]

